<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" style="background:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E11D48"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>

  <text x="45" y="38" font-size="16" font-weight="700" fill="#141413">Why a "Tiny 1.5° Compass Error" Matters in Real Life</text>

  <!-- Left Card: No Math / Pure Dead Reckoning -->
  <rect x="45" y="60" width="390" height="330" rx="14" fill="#FFF8F8" stroke="#FECDD3" stroke-width="1.5"/>
  <text x="70" y="92" font-size="14" font-weight="700" fill="#E11D48">AUV Without Kalman Filter ("Trust Me Bro" Mode)</text>
  <text x="70" y="114" font-size="12" fill="#5C5B57">"It is only a 1.5° compass bias, how bad could it be?"</text>

  <!-- Start & Intended Target -->
  <circle cx="95" cy="330" r="6" fill="#141413"/>
  <text x="75" y="352" font-size="11.5" font-family="monospace" fill="#141413">Start (0,0)</text>
  <line x1="95" y1="330" x2="380" y2="330" stroke="#9EA3AE" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="380" cy="330" r="6" fill="#10B981"/>
  <text x="310" y="355" font-size="11.5" font-weight="600" fill="#10B981">Target: Undersea Cable</text>

  <!-- Wild Drift Path -->
  <path d="M 95 330 Q 210 310 345 175" fill="none" stroke="#E11D48" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr-r)"/>
  <ellipse cx="355" cy="165" rx="52" ry="30" transform="rotate(-35 355 165)" fill="rgba(225,29,72,0.12)" stroke="#E11D48" stroke-width="1.5"/>
  <text x="275" y="122" font-size="12" font-weight="700" fill="#E11D48">Actual Location: Atlantis?</text>
  <text x="275" y="138" font-size="11" font-family="monospace" fill="#5C5B57">Error Σ → ∞ (Lost at sea)</text>

  <!-- Right Card: With Our 5 Math Modules -->
  <rect x="465" y="60" width="390" height="330" rx="14" fill="#F4F8FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="490" y="92" font-size="14" font-weight="700" fill="#2563EB">AUV With Our 5 Math Modules (Every 30.2s Ping)</text>
  <text x="490" y="114" font-size="12" fill="#5C5B57">Rotation Matrix R(ψ) + Gauss-Jordan + Kalman Gain K</text>

  <circle cx="515" cy="260" r="6" fill="#141413"/>
  <text x="495" y="285" font-size="11.5" font-family="monospace" fill="#141413">Start (0,0)</text>
  <line x1="515" y1="260" x2="800" y2="260" stroke="#10B981" stroke-width="2"/>

  <!-- Sawtooth Kalman Path -->
  <polyline points="515,260 580,238 585,257 650,234 655,258 720,236 725,259 792,256" fill="none" stroke="#2563EB" stroke-width="2.8" marker-end="url(#arr-b)"/>
  <circle cx="585" cy="257" r="4" fill="#2563EB"/>
  <circle cx="655" cy="258" r="4" fill="#2563EB"/>
  <circle cx="725" cy="259" r="4" fill="#2563EB"/>
  <circle cx="800" cy="260" r="7" fill="#10B981"/>

  <text x="565" y="215" font-size="11.5" font-family="monospace" font-weight="600" fill="#2563EB">Acoustic Pings Pull Error Back ≤ 2.0 m</text>
  <text x="530" y="345" font-size="12.5" font-weight="700" fill="#141413">Result: Subsea Internet Cable Repaired.</text>
  <text x="530" y="364" font-size="12" fill="#5C5B57">Everyone's hostel Wi-Fi survives another day.</text>
</svg>