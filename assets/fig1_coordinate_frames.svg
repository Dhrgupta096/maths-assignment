<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" style="background:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#141413"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E11D48"/>
    </marker>
  </defs>

  <!-- Subtle Grid -->
  <g stroke="#F1F0EC" stroke-width="1">
    <line x1="100" y1="80" x2="840" y2="80"/><line x1="100" y1="160" x2="840" y2="160"/>
    <line x1="100" y1="240" x2="840" y2="240"/><line x1="100" y1="320" x2="840" y2="320"/>
    <line x1="100" y1="400" x2="840" y2="400"/>
    <line x1="220" y1="50" x2="220" y2="430"/><line x1="360" y1="50" x2="360" y2="430"/>
    <line x1="500" y1="50" x2="500" y2="430"/><line x1="640" y1="50" x2="640" y2="430"/>
    <line x1="780" y1="50" x2="780" y2="430"/>
  </g>

  <!-- Title -->
  <text x="50" y="38" font-size="16" font-weight="700" fill="#141413">Figure 1: Body-to-Earth Coordinate Transformation &amp; Two-Leg Vector Path</text>

  <!-- Earth Axes (X East, Y North) Origin at (140, 410) -->
  <line x1="140" y1="410" x2="830" y2="410" stroke="#141413" stroke-width="2" marker-end="url(#arr-dark)"/>
  <line x1="140" y1="410" x2="140" y2="65" stroke="#141413" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="775" y="438" font-size="13" font-weight="600" fill="#141413">Earth X (East)</text>
  <text x="52" y="75" font-size="13" font-weight="600" fill="#141413">Earth Y (North)</text>
  <text x="108" y="432" font-size="12" font-family="monospace" fill="#5C5B57">p0(0, 0)</text>

  <!-- Move 1: p0(140, 410) to p1(140 + 8.66*48 = 556, 410 - 5.0*34 = 240) -->
  <!-- Wait: uniform scale 34 px per meter: p1 = (140 + 8.66*34 = 434.4, 410 - 5*34 = 240) -->
  <line x1="140" y1="410" x2="434" y2="240" stroke="#2563EB" stroke-width="3" marker-end="url(#arr-blue)"/>
  <line x1="434" y1="240" x2="434" y2="410" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="5,5"/>
  <line x1="140" y1="240" x2="434" y2="240" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="5,5"/>

  <!-- Heading Angle Arc psi1 = 30 deg -->
  <path d="M 210 410 A 70 70 0 0 0 200.6 375" fill="none" stroke="#2563EB" stroke-width="1.8"/>
  <text x="218" y="396" font-size="13" font-family="monospace" font-weight="600" fill="#2563EB">ψ1 = 30°</text>
  <text x="255" y="308" font-size="13" font-weight="600" fill="#2563EB">Move 1: Δx_b = 10 m</text>
  <circle cx="434" cy="240" r="5" fill="#2563EB"/>
  <text x="446" y="245" font-size="13" font-family="monospace" font-weight="700" fill="#141413">p1 = (8.66 m, 5.00 m)</text>

  <!-- Move 2: p1(434, 240) to p2(140 + 3.93*34 = 273.6, 410 - 9.20*34 = 97.2) -->
  <line x1="434" y1="240" x2="274" y2="97" stroke="#10B981" stroke-width="3" marker-end="url(#arr-green)"/>
  <circle cx="274" cy="97" r="5.5" fill="#10B981"/>
  <text x="288" y="92" font-size="13" font-family="monospace" font-weight="700" fill="#10B981">p2 = (3.93 m, 9.20 m)</text>
  <text x="365" y="155" font-size="12.5" font-weight="600" fill="#10B981">Move 2 (ψ2 = 120°, Surge 6m, Sway 2m)</text>

  <!-- Inset Diagram: Local Robot Body Frame (x_b, y_b) at Right -->
  <rect x="595" y="75" width="265" height="215" rx="12" fill="#F8F8F5" stroke="#E2DFD7" stroke-width="1.5"/>
  <text x="615" y="102" font-size="13" font-weight="700" fill="#141413">Robot Local Body Basis</text>
  <g transform="translate(715, 200) rotate(-30)">
    <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#0F1115"/>
    <line x1="0" y1="0" x2="78" y2="0" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>
    <line x1="0" y1="0" x2="0" y2="-68" stroke="#E11D48" stroke-width="2.5" marker-end="url(#arr-red)"/>
    <text x="48" y="18" font-size="12" font-family="monospace" font-weight="700" fill="#2563EB">x_b (Surge)</text>
    <text x="-68" y="-52" font-size="12" font-family="monospace" font-weight="700" fill="#E11D48">y_b (Sway)</text>
  </g>
  <text x="615" y="272" font-size="11.5" font-family="monospace" fill="#5C5B57">Δp_E = R(ψ) · [Δx_b, Δy_b]ᵀ</text>
</svg>